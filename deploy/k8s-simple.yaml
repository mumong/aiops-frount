apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-copilot-frontend
  namespace: aiops
  labels:
    app: aiops-copilot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-copilot-frontend
  template:
    metadata:
      labels:
        app: aiops-copilot-frontend
    spec:
      containers:
        - name: frontend
          image: 10.2.0.86:8443/xnet-cloud/aiops-copilot-frontend:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-copilot-frontend
  namespace: aiops
  labels:
    app: aiops-copilot-frontend
spec:
  type: NodePort
  selector:
    app: aiops-copilot-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
